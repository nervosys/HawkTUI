[package]
name = "hawktui"
version = "1.0.0"
edition = "2021"
authors = ["Nervosys"]
description = "An agentic-first TUI framework with complete ontology for agent discoverability"
license = "AGPL-3.0-or-later"
repository = "https://github.com/nervosys/HawkTUI"
homepage = "https://github.com/nervosys/HawkTUI"
documentation = "https://docs.rs/hawktui"
readme = "README.md"
keywords = ["tui", "terminal", "agent", "ontology", "ui"]
categories = ["command-line-interface", "gui"]
rust-version = "1.80"
# Documentation an agent or a user needs while writing against the crate ships
# inside the package; excluding all of `docs/` meant `cargo add hawktui`
# delivered a README and nothing else. Only internal material is excluded.
exclude = [
    "reference/",
    ".github/",
    "scripts/",
    "website/",
    "benchmarks/",
    "docs/AGENT-DX-PLAN.md",                    # internal roadmap
    "docs/SECURITY-AUDIT.md",                   # internal audit
    "docs/blog-why-agents-need-ui-ontology.md", # marketing, lives on the site
]

[lib]
name = "hawktui"

[features]
default = ["crossterm"]
crossterm = ["dep:crossterm"]
bin = ["dep:tracing", "dep:tracing-subscriber"]

[dependencies]
crossterm = { version = "0.28", optional = true }
unicode-width = "0.2"
unicode-segmentation = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = [
    "fmt",
    "env-filter",
], optional = true }

[dev-dependencies]
pretty_assertions = "1"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

[[bench]]
name = "core_bench"
harness = false

[[example]]
name = "hello"
path = "examples/hello.rs"
required-features = ["crossterm"]

[[example]]
name = "counter"
path = "examples/counter.rs"
required-features = ["crossterm"]

[[example]]
name = "agent_demo"
path = "examples/agent_demo.rs"
required-features = ["crossterm"]

[[example]]
name = "agent_rpc"
path = "examples/agent_rpc.rs"

[[example]]
name = "opencode"
path = "examples/opencode.rs"
required-features = ["crossterm"]

[[example]]
name = "lazygit"
path = "examples/lazygit.rs"
required-features = ["crossterm"]

[[example]]
name = "btop"
path = "examples/btop.rs"
required-features = ["crossterm"]

[[bin]]
name = "hawktui-mcp"
path = "src/bin/hawktui_mcp.rs"

[[bin]]
name = "hawktui-ontology"
path = "src/bin/hawktui_ontology.rs"

[[bin]]
name = "hawktui-server"
path = "src/bin/hawktui_server.rs"
required-features = ["bin"]

[[bin]]
name = "hawktui-demo"
required-features = ["bin"]
path = "src/bin/hawktui_demo.rs"
